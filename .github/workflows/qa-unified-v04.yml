name: v0.4 Unified Human QA DirectML Portable

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ui/qt/duplicate_review.py"
      - "tests/duplicate_review_ui_smoke.py"
      - "resources/translations/app_en_US.ts"
      - "tools/qa-unified-v04.ps1"
      - ".github/workflows/qa-unified-v04.yml"
      - "requirements/runtime-directml.txt"
      - "docs/PROJECT_STATE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-directml-qa:
    runs-on: windows-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime-directml.txt
            requirements/build.txt

      - name: Install verified DirectML runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements/runtime-directml.txt -r requirements/build.txt
          python tools/install_ui_dependencies.py
          @'
          import onnxruntime as ort
          from importlib import metadata
          assert metadata.version("onnxruntime-directml") == "1.24.4"
          assert "DmlExecutionProvider" in ort.get_available_providers()
          assert "CPUExecutionProvider" in ort.get_available_providers()
          print("DirectML and CPU execution providers: PASS")
          '@ | python -

      - name: Verify integrated Duplicate + Composite Qt UI and shared provider policy
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/duplicate_review_ui_smoke.py
          python tests/composite_review_ui_smoke.py
          python tests/settings_inference_runtime_smoke.py

      - name: Prepare pinned production bundled models
        shell: pwsh
        run: |
          python tools/prepare_bundled_models.py --root resources/models
          $expected = "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb"
          $actual = (Get-FileHash "resources\models\ediffiqa_t.onnx" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source eDifFIQA model SHA mismatch" }

      - name: Full source app self-test
        shell: pwsh
        run: |
          python app.py --self-test

      - name: Build unified self-contained Windows DirectML Portable
        shell: pwsh
        run: |
          .\tools\build_portable.ps1

      - name: Verify packaged DirectML model, UI and EXE
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist\Face-LoRA-Dataset-Selector"
          $exe = Join-Path $root "Face LoRA Dataset Selector.exe"
          $model = Join-Path $root "_internal\models\ediffiqa_t.onnx"
          if (-not (Test-Path $exe)) { throw "EXE missing" }
          if (-not (Test-Path $model)) { throw "eDifFIQA model missing" }
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant() -ne "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb") {
            throw "Packaged eDifFIQA model SHA mismatch"
          }
          $dml = @(Get-ChildItem (Join-Path $root "_internal") -Recurse -File -Filter DirectML.dll)
          if ($dml.Count -eq 0) { throw "DirectML.dll absent from distributable" }
          $ui = (Get-Content "src\ui\qt\duplicate_review.py" -Raw)
          if (-not $ui.Contains("class DuplicateCompareGrid")) { throw "Duplicate Review v0.4 UI not integrated" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged self-test exit $($p.ExitCode)" }
          Write-Host "Unified Duplicate/Composite UI, DirectML package and pinned model: PASS"

      - name: Create portable ZIP and SHA-256
        shell: pwsh
        run: |
          $name = "Face-LoRA-v04-Unified-DirectML-Portable"
          $zip = "$name.zip"
          Compress-Archive -Path "dist\Face-LoRA-Dataset-Selector" -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Offline v0.3.1 cache migration and installer idempotency smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "UnifiedQA"
          $old = Join-Path $env:RUNNER_TEMP "Face-LoRA-Dataset-Selector-v0.3.1"
          $archive = Join-Path $PWD "Face-LoRA-v04-Unified-DirectML-Portable.zip"
          $oldCache = Join-Path $old "_userdata\cache"
          New-Item -ItemType Directory -Force -Path $oldCache | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $old "cache") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $old "_FaceLoRA_ModelCache") | Out-Null
          Copy-Item -LiteralPath "dist\Face-LoRA-Dataset-Selector\Face LoRA Dataset Selector.exe" -Destination (Join-Path $old "Face LoRA Dataset Selector.exe")
          '{"version":3,"analysis_version":4,"records":[{"path":"G:\\Luna\\original.jpg","manual_status":"推荐","status":"推荐"}]}' | Set-Content -LiteralPath (Join-Path $oldCache "db.json") -Encoding utf8
          '{"version":3,"analysis_version":4,"records":[]}' | Set-Content -LiteralPath (Join-Path $old "cache\old.json") -Encoding utf8
          'model-cache-fixture' | Set-Content (Join-Path $old "_FaceLoRA_ModelCache\sample.bin") -Encoding ascii
          'ui-fixture' | Set-Content (Join-Path $old "ui.ini") -Encoding ascii
          & pwsh -NoProfile -File .\tools\qa-unified-v04.ps1 -Root $root -OldRoot $old -LocalPackageZip $archive -ArtifactId 123456 -ArtifactCommit "${{ github.sha }}" -PrepareOnly -CiFixture
          if ($LASTEXITCODE -ne 0) { throw "Unified QA initial installation failed" }
          $info = Get-Content (Join-Path $root "QA_REPORT.json") -Raw | ConvertFrom-Json
          $dest = Join-Path $root "app"
          if ($info.status -ne "prepared" -or $info.migrated_files -lt 3 -or $info.new_cache_json_files -lt 2 -or $info.conflicts.Count -gt 0) {
            throw "Old user-state migration report was not verified"
          }
          foreach ($pair in @(
            @((Join-Path $oldCache "db.json"), (Join-Path $dest "_userdata\cache\db.json")),
            @((Join-Path $old "cache\old.json"), (Join-Path $dest "_userdata\cache\old.json")),
            @((Join-Path $old "_FaceLoRA_ModelCache\sample.bin"), (Join-Path $dest "_FaceLoRA_ModelCache\sample.bin")),
            @((Join-Path $old "ui.ini"), (Join-Path $dest "ui.ini"))
          )) {
            if (-not (Test-Path -LiteralPath $pair[1])) { throw "Missing migrated file: $($pair[1])" }
            if ((Get-FileHash $pair[0]).Hash -ne (Get-FileHash $pair[1]).Hash) {
              throw "Original migrated file changed or copy mismatched."
            }
          }
          & pwsh -NoProfile -File .\tools\qa-unified-v04.ps1 -Root $root -OldRoot $old -LocalPackageZip $archive -ArtifactId 123456 -ArtifactCommit "${{ github.sha }}" -PrepareOnly -CiFixture
          if ($LASTEXITCODE -ne 0) { throw "Unified QA idempotent rerun failed" }
          $again = Get-Content (Join-Path $root "QA_REPORT.json") -Raw | ConvertFrom-Json
          if ($again.status -ne "prepared" -or $again.mode -ne "cached-existing-app" -or $again.conflicts.Count -gt 0) {
            throw "Unified QA cached rerun did not preserve migrated state"
          }
          Write-Host "DirectML unified Portable + non-destructive v0.3.1 cache/settings migration PASS"

      - name: Upload unified DirectML human QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-lora-v04-unified-directml
          path: |
            Face-LoRA-v04-Unified-DirectML-Portable.zip
            Face-LoRA-v04-Unified-DirectML-Portable.zip.sha256
          if-no-files-found: error
