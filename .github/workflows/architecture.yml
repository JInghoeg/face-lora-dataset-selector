name: Architecture Boundaries

on:
  pull_request:
    paths:
      - "src/core/**"
      - "src/features/**"
      - "src/infrastructure/**"
      - "src/application/**"
      - "src/ui/**"
      - "app.py"
      - "src/app_main.py"
      - "tests/duplicate_backend_smoke.py"
      - ".importlinter"
      - "requirements/dev.txt"
      - ".github/workflows/architecture.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
    paths:
      - "src/core/**"
      - "src/features/**"
      - "src/infrastructure/**"
      - "src/application/**"
      - "src/ui/**"
      - "app.py"
      - "src/app_main.py"
      - "tests/duplicate_backend_smoke.py"
      - ".importlinter"
      - "requirements/dev.txt"
      - ".github/workflows/architecture.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: "${{ github.workspace }}/src"

jobs:
  architecture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install architecture tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements/dev.txt

      - name: Compile architecture packages
        shell: pwsh
        run: |
          python -m compileall src app.py

      - name: Enforce import contracts
        shell: pwsh
        run: |
          lint-imports

      - name: Duplicate backend smoke
        shell: pwsh
        run: |
          python tests/duplicate_backend_smoke.py
