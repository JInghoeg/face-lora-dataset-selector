name: Auto Crop Visual Choice

on:
  push:
    branches:
      - ux/auto-crop-review-spike
    paths:
      - "tests/auto_crop_visual_choice.py"
      - ".github/workflows/auto-crop-visual-choice.yml"
  pull_request:
    paths:
      - "tests/auto_crop_visual_choice.py"
      - ".github/workflows/auto-crop-visual-choice.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  render:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production runtime + visual candidates
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir qt-material==2.17 QDarkStyle==3.2.3
          python -m pip install --no-cache-dir darkdetect==0.8.0 pywin32==312
          python -m pip install --no-cache-dir --no-deps PySideSix-Frameless-Window==0.8.2
          python -m pip install --no-cache-dir --no-deps PySide6-Fluent-Widgets==1.11.3

      - name: Render real Auto Crop choices
        shell: pwsh
        run: |
          python tests/auto_crop_visual_choice.py --out visual-choice

      - name: Upload visual choices
        uses: actions/upload-artifact@v4
        with:
          name: auto-crop-visual-choice
          path: visual-choice/*.png
          if-no-files-found: error
          retention-days: 7
