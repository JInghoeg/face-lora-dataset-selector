name: Vendor eDifFIQA Model Once

on:
  push:
    branches:
      - research/ediffiqa-directml-batch1
    paths:
      - ".github/workflows/vendor-ediffiqa-model-once.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ediffiqa-directml-batch1
          fetch-depth: 0

      - name: Download and verify current official eDifFIQA-T
        shell: pwsh
        run: |
          $target = Join-Path $PWD "resources\models\ediffiqa_t.onnx"
          $tmp = Join-Path $PWD "ediffiqa_t.onnx.download"
          Invoke-WebRequest -Uri "https://github.com/yakhyo/face-image-quality-assessment/releases/download/weights/ediffiqa_t.onnx" -OutFile $tmp
          $hash = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb"
          if ($hash -ne $expected) {
            throw "Unexpected eDifFIQA SHA256: $hash"
          }
          Move-Item $tmp $target -Force

      - name: Commit pinned binary to research branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/models/ediffiqa_t.onnx
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tracked model already matches pinned upstream file."
            exit 0
          }
          git commit -m "build: vendor current official eDifFIQA ONNX"
          git push origin HEAD:research/ediffiqa-directml-batch1
