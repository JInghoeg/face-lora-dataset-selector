name: Dataset Review Shell

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/app_main.py"
      - "src/ui/qt/dataset_review.py"
      - "src/ui/qt/dataset_view.py"
      - "src/ui/qt/__init__.py"
      - "tests/dataset_review_shell_ui_smoke.py"
      - "tests/dataset_view_ui_smoke.py"
      - "tools/install_ui_dependencies.py"
      - ".github/workflows/dataset-review-shell.yml"
  push:
    branches:
      - "ui/v0.4-main-dataset-review-shell"
    paths:
      - "src/app_main.py"
      - "src/ui/qt/dataset_review.py"
      - "src/ui/qt/dataset_view.py"
      - "src/ui/qt/__init__.py"
      - "tests/dataset_review_shell_ui_smoke.py"
      - "tests/dataset_view_ui_smoke.py"
      - "tools/install_ui_dependencies.py"
      - ".github/workflows/dataset-review-shell.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  fluent-shell:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install production runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements/runtime.txt
          python tools/install_ui_dependencies.py

      - name: Prove Essentials-only Fluent runtime
        shell: pwsh
        run: |
          python -c "import qfluentwidgets; print('QFluentWidgets OK')"
          python -c "import importlib.util; assert importlib.util.find_spec('PySide6.QtCharts') is None, 'PySide6-Addons unexpectedly installed'; print('PySide6-Essentials only OK')"

      - name: Compile Dataset Review presentation
        shell: pwsh
        run: |
          python -m compileall src/ui/qt/dataset_review.py src/app_main.py tests/dataset_review_shell_ui_smoke.py

      - name: Full selector self-test
        shell: pwsh
        run: |
          python app.py --self-test

      - name: Download temporary CJK font for screenshot
        if: ${{ matrix.python == '3.12' }}
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP "NotoSansCJKsc-Regular.otf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" -OutFile $font
          "DATASET_REVIEW_VISUAL_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Dataset Review Fluent shell smoke
        shell: pwsh
        run: |
          if ("${{ matrix.python }}" -eq "3.12") {
            python tests/dataset_review_shell_ui_smoke.py --out production-render
          } else {
            python tests/dataset_review_shell_ui_smoke.py
          }

      - name: Upload production screenshot
        if: ${{ matrix.python == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: dataset-review-shell-screenshot
          path: production-render/dataset_review_shell.png
          if-no-files-found: error
          retention-days: 7
