name: Duplicate Review Visual Render

on:
  push:
    branches:
      - integration/v04-settings-text-duplicate-qa
    paths:
      - "src/ui/qt/duplicate_review.py"
      - "tests/duplicate_review_ui_smoke.py"
      - ".github/workflows/duplicate-review-visual-render.yml"
  pull_request:
    paths:
      - "src/ui/qt/duplicate_review.py"
      - "tests/duplicate_review_ui_smoke.py"
      - ".github/workflows/duplicate-review-visual-render.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Duplicate Review UI runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "PySide6-Essentials>=6.6,<6.9" "Pillow>=10,<12"
          python tools/install_ui_dependencies.py

      - name: Download CJK font for deterministic render
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP "NotoSansCJKsc-Regular.otf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" -OutFile $font
          "DUPLICATE_VISUAL_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render current production Duplicate Review
        shell: pwsh
        run: |
          python tests/duplicate_review_ui_smoke.py --out duplicate-render --render-count 6 --theme dark

      - name: Upload Duplicate Review render
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-review-v04-current-production-render
          path: duplicate-render/*.png
          if-no-files-found: error
          retention-days: 14
