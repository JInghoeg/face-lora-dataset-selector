name: Auto Crop Stage 3 Research

on:
  push:
    branches:
      - research/auto-crop-stage3-safe-trim
    paths:
      - "research/auto_crop_stage3_safe_trim.py"
      - "research/AUTO_CROP_STAGE3.md"
      - ".github/workflows/auto-crop-stage3-research.yml"
  pull_request:
    paths:
      - "research/auto_crop_stage3_safe_trim.py"
      - "research/AUTO_CROP_STAGE3.md"
      - ".github/workflows/auto-crop-stage3-research.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  geometry:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install only Pillow for geometry self-test
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<12"

      - name: Compile Stage 3 harness
        shell: pwsh
        run: |
          python -m py_compile research/auto_crop_stage3_safe_trim.py

      - name: Run pure geometry self-test
        shell: pwsh
        run: |
          python research/auto_crop_stage3_safe_trim.py --self-test
