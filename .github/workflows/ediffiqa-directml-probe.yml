name: eDifFIQA DirectML Final Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/benchmarks/ediffiqa_graph_lab.py"
      - "tools/benchmarks/ediffiqa_candidate_probe.py"
      - "tools/qa-ediffiqa-directml.ps1"
      - "tools/qa-ediffiqa-recover-profile.ps1"
      - "tests/ediffiqa_final_probe_smoke.py"
      - "packaging/ediffiqa_candidate_probe.spec"
      - ".github/workflows/ediffiqa-directml-probe.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ediffiqa-directml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements/runtime-directml.txt
            requirements/build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime-directml.txt -r requirements/build.txt
          python -m pip install "onnx>=1.16,<2"

      - name: Compile research tools
        shell: pwsh
        run: |
          python -m py_compile tools/benchmarks/ediffiqa_graph_lab.py
          python -m py_compile tools/benchmarks/ediffiqa_candidate_probe.py
          python tools/benchmarks/ediffiqa_candidate_probe.py --help
          foreach ($script in @("tools/qa-ediffiqa-directml.ps1", "tools/qa-ediffiqa-recover-profile.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors)
            if (@($parseErrors).Count -gt 0) { throw "PowerShell parse errors in $script : $parseErrors" }
          }

      - name: Verify SHA-pinned single-model target behavior
        shell: pwsh
        run: python tests/ediffiqa_final_probe_smoke.py

      - name: Analyze legacy vs upstream eDifFIQA graphs
        shell: pwsh
        run: |
          $lab = Join-Path $PWD "_research_output\ediffiqa-graph-lab"
          New-Item -ItemType Directory -Force $lab | Out-Null

          # The research branch now vendors the current official model at the
          # production path. Preserve main's legacy binary as the immutable
          # comparison baseline instead of accidentally comparing upstream to itself.
          git fetch origin main --quiet
          $legacy = Join-Path $lab "ediffiqa_t_legacy_main.onnx"
          $cmdLine = 'git show origin/main:resources/models/ediffiqa_t.onnx > "' + $legacy + '"'
          cmd.exe /d /s /c $cmdLine
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $legacy)) {
            throw "Unable to extract legacy eDifFIQA model from origin/main."
          }

          $upstream = Join-Path $lab "ediffiqa_t_upstream.onnx"
          Invoke-WebRequest -Uri "https://github.com/yakhyo/face-image-quality-assessment/releases/download/weights/ediffiqa_t.onnx" -OutFile $upstream

          $hash = (Get-FileHash $upstream -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb") {
            throw "Unexpected upstream SHA256: $hash"
          }

          python tools/benchmarks/ediffiqa_graph_lab.py --legacy $legacy --upstream $upstream --out-dir $lab

          $report = Get-Content (Join-Path $lab "ediffiqa-graph-lab.json") -Raw | ConvertFrom-Json

          if (-not $report.candidates.legacy_fixed.cpu_equivalence.allclose) {
            throw "Fixed legacy model is not CPU-equivalent."
          }
          if (-not $report.candidates.legacy_fixed_optimized.cpu_equivalence.allclose) {
            throw "Optimized fixed legacy model is not CPU-equivalent."
          }
          if (-not $report.candidates.upstream_current.cpu_equivalence.allclose) {
            throw "Current upstream model is not CPU-equivalent."
          }
          if (-not $report.candidates.upstream_current.cpu_equivalence.exact) {
            throw "Current upstream model is not bit-exact across the deterministic suite."
          }
          if ($report.candidates.upstream_current.cpu_equivalence.case_count -lt 100) {
            throw "Functional equivalence suite is unexpectedly small."
          }

          Write-Host "Legacy input:" ($report.legacy.inputs | ConvertTo-Json -Compress)
          Write-Host "Fixed input:" ($report.candidates.legacy_fixed.summary.inputs | ConvertTo-Json -Compress)
          Write-Host "Fully static input:" ($report.candidates.legacy_fully_static.summary.inputs | ConvertTo-Json -Compress)
          Write-Host "Fully static optimized input:" ($report.candidates.legacy_fully_static_optimized.summary.inputs | ConvertTo-Json -Compress)
          Write-Host "Upstream input:" ($report.candidates.upstream_current.summary.inputs | ConvertTo-Json -Compress)

          Write-Host "Legacy shape nodes:" ($report.legacy.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Fixed shape nodes:" ($report.candidates.legacy_fixed.summary.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Fully static shape nodes:" ($report.candidates.legacy_fully_static.summary.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Fully static optimized shape nodes:" ($report.candidates.legacy_fully_static_optimized.summary.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Upstream shape nodes:" ($report.candidates.upstream_current.summary.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)

          Write-Host "Legacy reshape paths:" ($report.legacy_reshape_paths | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Fixed reshape paths:" ($report.candidates.legacy_fixed.reshape_paths | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Fully static reshape paths:" ($report.candidates.legacy_fully_static.reshape_paths | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Fully static optimized reshape paths:" ($report.candidates.legacy_fully_static_optimized.reshape_paths | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Fully static patches:" ($report.fully_static_patches | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Upstream reshape paths:" ($report.candidates.upstream_current.reshape_paths | ConvertTo-Json -Depth 10 -Compress)

          Write-Host "Upstream max abs diff:" $report.candidates.upstream_current.cpu_equivalence.max_abs_diff
          Write-Host "Upstream exact equivalence:" $report.candidates.upstream_current.cpu_equivalence.exact
          Write-Host "Upstream equivalence cases:" $report.candidates.upstream_current.cpu_equivalence.case_count
          Write-Host "Upstream large initializer multiset identical:" $report.candidates.upstream_current.large_initializer_equivalence.identical_multiset
          Write-Host "Upstream large initializer reference count:" $report.candidates.upstream_current.large_initializer_equivalence.reference_count
          Write-Host "Upstream large initializer candidate count:" $report.candidates.upstream_current.large_initializer_equivalence.candidate_count
          Write-Host "Upstream missing initializer details:" ($report.candidates.upstream_current.large_initializer_equivalence.missing_details | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Upstream extra initializer details:" ($report.candidates.upstream_current.large_initializer_equivalence.extra_details | ConvertTo-Json -Depth 8 -Compress)

      - name: Build candidate probe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/ediffiqa_candidate_probe.spec

      - name: Validate packaged CPU probe in an isolated reusable-runtime fixture
        shell: pwsh
        run: |
          # Do not depend on historical GitHub Actions artifacts (they expire).
          # The real target workstation already proved checkpoint EXE reuse works;
          # this CI fixture checks the current packaged PyInstaller runtime and
          # the replacement model without downloading a 400+ MB old checkpoint.
          $baseDir = Join-Path $PWD "_research_output\checkpoint-base"
          $targetDir = Join-Path $baseDir "FaceLoRA-DirectML-Checkpoint"
          $bundle = Join-Path $PWD "dist\FaceLoRA-eDifFIQA-Candidate-Probe"
          $probeExe = Join-Path $bundle "Face LoRA eDifFIQA Candidate Probe.exe"
          $runtime = Join-Path $bundle "_internal"
          if (-not (Test-Path -LiteralPath $probeExe -PathType Leaf) -or
              -not (Test-Path -LiteralPath $runtime -PathType Container)) {
            throw "New probe build has no reusable PyInstaller runtime."
          }
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -LiteralPath $runtime -Destination (Join-Path $targetDir "_internal") -Recurse -Force
          Copy-Item -LiteralPath $probeExe -Destination (Join-Path $targetDir "Face LoRA DirectML Checkpoint.exe") -Force
          $targetExe = Join-Path $targetDir "Face LoRA eDifFIQA Candidate Probe.exe"
          Copy-Item -LiteralPath $probeExe -Destination $targetExe -Force

          $candidates = Join-Path $targetDir "ediffiqa-candidates"
          New-Item -ItemType Directory -Force -Path $candidates | Out-Null
          $targetModel = Join-Path $candidates "ediffiqa_t_upstream.onnx"
          Copy-Item "resources\models\ediffiqa_t.onnx" $targetModel -Force

          $modelHash = (Get-FileHash $targetModel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelHash -ne "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb") {
            throw "Final probe model hash mismatch: $modelHash"
          }
          $out = Join-Path $PWD "_research_output\dropin-upstream_current-cpu.json"
          $progress = Join-Path $PWD "_research_output\dropin-upstream_current-cpu.progress.jsonl"
          $args = @("--child","--candidate","upstream_current","--provider","cpu","--output",$out,"--progress",$progress)
          $p = Start-Process -FilePath $targetExe -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged eDifFIQA CPU probe failed: $($p.ExitCode)" }
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if ($result.status -ne "pass" -or
              $result.model_sha256 -ne "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb") {
            throw "Packaged CPU probe/model identity verification failed."
          }

      - name: Build candidate artifact
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "_research_output\ediffiqa-candidate-package"
          $models = Join-Path $dir "ediffiqa-candidates"
          New-Item -ItemType Directory -Force $models | Out-Null

          Copy-Item (Join-Path $PWD "dist\FaceLoRA-eDifFIQA-Candidate-Probe\Face LoRA eDifFIQA Candidate Probe.exe") $dir
          Copy-Item "resources\models\ediffiqa_t.onnx" (Join-Path $models "ediffiqa_t_upstream.onnx") -Force
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa-graph-lab.json" $dir -Force

          @'
          eDifFIQA DirectML Candidate Probe
          =================================

          The verified one-command QA helper downloads and installs this small
          overlay into the existing DirectML checkpoint folder. Do not manually
          unzip or copy files. It adds:
          - Face LoRA eDifFIQA Candidate Probe.exe
          - ediffiqa-candidates\ediffiqa_t_upstream.onnx
          - ediffiqa-graph-lab.json

          The target probe runs ONLY the exact current official eDifFIQA-T
          model tracked at the production resource path on this PR.
          DirectML Python fallback and CPU EP fallback are disabled.
          A PASS therefore requires a real DmlExecutionProvider session.

          The one-command helper writes one combined report:
          qa-ediffiqa-last-run.json
          Return only that file after the target RTX run.
          '@ | Set-Content -Path (Join-Path $dir "README.txt") -Encoding UTF8

          $files = @(
            "Face LoRA eDifFIQA Candidate Probe.exe",
            "ediffiqa-candidates/ediffiqa_t_upstream.onnx",
            "ediffiqa-graph-lab.json"
          )
          $entries = @()
          foreach ($relative in $files) {
            $path = Join-Path $dir $relative
            $entries += [ordered]@{
              path = $relative
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest = [ordered]@{ schema_version = 1; files = $entries }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $dir "payload.sha256.json") -Encoding UTF8
          Compress-Archive -Path "$dir\*" -DestinationPath "FaceLoRA-eDifFIQA-Candidate-Probe.zip" -CompressionLevel Optimal -Force

      - name: Validate one-command QA overlay preparation against reusable-runtime fixture
        shell: pwsh
        run: |
          $checkpoint = Join-Path $PWD "_research_output\checkpoint-base"
          $zip = Join-Path $PWD "FaceLoRA-eDifFIQA-Candidate-Probe.zip"
          & pwsh -NoProfile -File tools/qa-ediffiqa-directml.ps1 -CheckpointRoot $checkpoint -PackageZip $zip -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw "One-command QA deploy preflight failed." }
          $singleReport = Get-ChildItem $checkpoint -Recurse -File -Filter "qa-ediffiqa-last-run.json" | Select-Object -First 1
          if (-not $singleReport) { throw "Single QA report was not emitted by the wrapper." }
          $state = Get-Content $singleReport.FullName -Raw | ConvertFrom-Json
          if ($state.status -ne "prepared" -or $state.target_gpu_verified -ne $false) {
            throw "CI preparation must not claim real target DirectML pass."
          }
          Write-Host "Verified CI-only preparation and single-report contract (reusable-runtime fixture; RTX remains HUMAN UNVERIFIED)."

      - name: Validate zero-GPU profile recovery from previous probe
        shell: pwsh
        run: |
          $root = Join-Path $PWD "_research_output\recovery-fixture"
          New-Item -ItemType Directory -Force $root | Out-Null
          $profilePath = Join-Path $root "sample-ort-profile.json"
          $probePath = Join-Path $root "sample-probe.json"
          $qaPath = Join-Path $root "qa-ediffiqa-last-run.json"
          $expectedCommit = "9dd48e94e47afebb5eb09d88653156ac07eb1bc9"
          $expectedModel = "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb"

          $events = @(
            @{cat="Node"; name="Expand_kernel_time"; args=@{provider="CPUExecutionProvider"; op_name="Expand"}}
            @{cat="Node"; name="Conv_kernel_time"; args=@{provider="DmlExecutionProvider"; op_name="Conv"}}
            @{cat="Session"; name="model_run"; args=@{}}
          )
          $events | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $profilePath -Encoding UTF8
          $row = @{
            candidate = "upstream_current"
            status = "error"
            provider_requested = "directml"
            session_providers = @("DmlExecutionProvider", "CPUExecutionProvider")
            model_sha256 = $expectedModel
            outputs = @(@{seed=11}, @{seed=29}, @{seed=47})
            execution_profile = $profilePath
            error = @{message="append_event() got multiple values for argument 'path'"}
          }
          @{probes=@($row)} | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $probePath -Encoding UTF8
          $qa = @{
            status = "strict_directml_fail"
            artifact_commit = $expectedCommit
            artifact_run_id = 42235496927
            deployed_model_sha256 = $expectedModel
            probe_report = $probePath
          }
          $qa | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $qaPath -Encoding UTF8

          & pwsh -NoProfile -File tools/qa-ediffiqa-recover-profile.ps1 -CheckpointRoot $root
          if ($LASTEXITCODE -ne 0) { throw "Saved-profile recovery script failed." }
          $out = Join-Path $root "qa-ediffiqa-recovered-profile.json"
          $summary = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($summary.status -ne "gpu_execution_evidence_recovered" -or
              -not $summary.gpu_compute_verified -or
              $summary.dml_compute_kernel_events -ne 1 -or
              $summary.inference_runs_returned -ne 3 -or
              $summary.human_qa -ne "HUMAN_UNVERIFIED") {
            throw "Positive existing-profile recovery failed; $($summary | ConvertTo-Json -Depth 10)"
          }

          $events[1].args.provider = "CPUExecutionProvider"
          $events | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $profilePath -Encoding UTF8
          & pwsh -NoProfile -File tools/qa-ediffiqa-recover-profile.ps1 -CheckpointRoot $root
          $summary = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($summary.gpu_compute_verified -or
              $summary.status -ne "profile_does_not_prove_gpu_compute") {
            throw "CPU-only false PASS in recovery script."
          }
          Write-Host "Saved-profile recovery and CPU-only rejection PASS. No GPU runtime or download required."

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceLoRA-eDifFIQA-DirectML-Final-Probe
          path: FaceLoRA-eDifFIQA-Candidate-Probe.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload graph lab evidence
        uses: actions/upload-artifact@v4
        with:
          name: eDifFIQA-Graph-Lab
          path: |
            _research_output/ediffiqa-graph-lab/ediffiqa-graph-lab.json
            _research_output/ediffiqa-graph-lab/ediffiqa_t_legacy_batch1_fixed.onnx
            _research_output/ediffiqa-graph-lab/ediffiqa_t_legacy_fully_static.onnx
            _research_output/ediffiqa-graph-lab/ediffiqa_t_legacy_fully_static_optimized.onnx
            _research_output/ediffiqa-graph-lab/ediffiqa_t_upstream.onnx
          if-no-files-found: error
          retention-days: 7
