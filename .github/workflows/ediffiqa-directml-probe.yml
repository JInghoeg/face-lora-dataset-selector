name: eDifFIQA DirectML Batch1 Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/features/ranking/runtime.py"
      - "src/features/ranking/analysis.py"
      - "tools/benchmarks/ediffiqa_directml_probe.py"
      - "packaging/ediffiqa_directml_probe.spec"
      - ".github/workflows/ediffiqa-directml-probe.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ediffiqa-directml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements/runtime-directml.txt
            requirements/build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime-directml.txt -r requirements/build.txt

      - name: Compile targeted probe
        shell: pwsh
        run: |
          python -m py_compile src/features/ranking/runtime.py
          python -m py_compile tools/benchmarks/ediffiqa_directml_probe.py
          python tools/benchmarks/ediffiqa_directml_probe.py --help

      - name: CPU semantic equivalence
        shell: pwsh
        run: |
          $root = Join-Path $PWD "_research_output\ediffiqa-cpu"
          New-Item -ItemType Directory -Force $root | Out-Null

          python tools/benchmarks/ediffiqa_directml_probe.py --child --provider cpu --output "$root\dynamic.json" --progress "$root\dynamic.progress.jsonl"
          if ($LASTEXITCODE -ne 0) { throw "CPU dynamic eDifFIQA failed." }

          python tools/benchmarks/ediffiqa_directml_probe.py --child --provider cpu --batch1 --output "$root\batch1.json" --progress "$root\batch1.progress.jsonl"
          if ($LASTEXITCODE -ne 0) { throw "CPU batch1 eDifFIQA failed." }

          $dynamic = Get-Content "$root\dynamic.json" -Raw | ConvertFrom-Json
          $fixed = Get-Content "$root\batch1.json" -Raw | ConvertFrom-Json

          if (($dynamic.outputs | Measure-Object).Count -ne ($fixed.outputs | Measure-Object).Count) {
            throw "CPU comparison output count mismatch."
          }

          for ($i = 0; $i -lt $dynamic.outputs.Count; $i++) {
            $a = [double[]]$dynamic.outputs[$i].value
            $b = [double[]]$fixed.outputs[$i].value
            if ($a.Count -ne $b.Count) { throw "CPU output shape mismatch at sample $i." }
            for ($j = 0; $j -lt $a.Count; $j++) {
              $delta = [math]::Abs($a[$j] - $b[$j])
              $limit = 1e-7 + 1e-6 * [math]::Abs($a[$j])
              if ($delta -gt $limit) {
                throw "CPU outputs differ at sample $i value ${j}: delta=$delta limit=$limit"
              }
            }
          }
          Write-Host "PASS: batch=1 override is CPU-semantic-equivalent for deterministic inputs."

      - name: Build targeted probe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/ediffiqa_directml_probe.spec

      - name: Validate EXE drop-in against checkpoint payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $outerZip = Join-Path $PWD "_research_output\checkpoint-artifact.zip"
          $outerDir = Join-Path $PWD "_research_output\checkpoint-artifact"
          $baseDir = Join-Path $PWD "_research_output\checkpoint-base"

          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/JInghoeg/face-lora-dataset-selector/actions/artifacts/12889766078/zip" -OutFile $outerZip
          Expand-Archive -Path $outerZip -DestinationPath $outerDir -Force

          $inner = Get-ChildItem $outerDir -Recurse -File |
            Where-Object { $_.Name -eq "FaceLoRA-DirectML-Checkpoint-Windows-x64.zip" } |
            Select-Object -First 1
          if (-not $inner) { throw "Checkpoint inner ZIP not found." }

          Expand-Archive -Path $inner.FullName -DestinationPath $baseDir -Force

          $checkpointExe = Get-ChildItem $baseDir -Recurse -File |
            Where-Object { $_.Name -eq "Face LoRA DirectML Checkpoint.exe" } |
            Select-Object -First 1
          if (-not $checkpointExe) { throw "Checkpoint EXE not found." }

          $targetDir = $checkpointExe.Directory.FullName
          $newExe = Join-Path $PWD "dist\FaceLoRA-eDifFIQA-DirectML-Probe\Face LoRA eDifFIQA DirectML Probe.exe"
          $targetExe = Join-Path $targetDir "Face LoRA eDifFIQA DirectML Probe.exe"
          Copy-Item $newExe $targetExe -Force

          $out = Join-Path $PWD "_research_output\packaged-batch1-cpu.json"
          $progress = Join-Path $PWD "_research_output\packaged-batch1-cpu.progress.jsonl"
          $args = @("--child","--provider","cpu","--batch1","--output",$out,"--progress",$progress)
          $p = Start-Process -FilePath $targetExe -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Drop-in targeted probe failed: $($p.ExitCode)" }

          $result = Get-Content $out -Raw | ConvertFrom-Json
          if ($result.status -ne "pass") { throw "Drop-in targeted CPU probe did not pass." }
          if ($result.input_shape[0] -ne 1) { throw "Batch override did not resolve input shape to 1." }

      - name: Build EXE-only artifact
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "_research_output\ediffiqa-probe-exe"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item (Join-Path $PWD "dist\FaceLoRA-eDifFIQA-DirectML-Probe\Face LoRA eDifFIQA DirectML Probe.exe") $dir

          @'
          eDifFIQA DirectML Batch=1 Targeted Probe
          ========================================

          Copy "Face LoRA eDifFIQA DirectML Probe.exe" beside the existing
          "Face LoRA DirectML Checkpoint.exe" in the checkpoint folder.

          Double-click the new probe.
          It does not read a dataset and does not benchmark other models.

          Send:
          ediffiqa-directml-results\<timestamp>\ediffiqa-directml-batch1.json
          back to ChatGPT.
          '@ | Set-Content -Path (Join-Path $dir "README.txt") -Encoding UTF8

          Compress-Archive -Path "$dir\*" -DestinationPath "FaceLoRA-eDifFIQA-DirectML-Probe-EXE.zip" -CompressionLevel Optimal -Force

      - name: Upload targeted EXE
        uses: actions/upload-artifact@v4
        with:
          name: FaceLoRA-eDifFIQA-DirectML-Probe-EXE
          path: FaceLoRA-eDifFIQA-DirectML-Probe-EXE.zip
          if-no-files-found: error
          retention-days: 7
