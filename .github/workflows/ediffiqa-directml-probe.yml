name: eDifFIQA DirectML Candidate Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/benchmarks/ediffiqa_graph_lab.py"
      - "tools/benchmarks/ediffiqa_candidate_probe.py"
      - "tools/benchmarks/ediffiqa_directml_probe.py"
      - "packaging/ediffiqa_candidate_probe.spec"
      - ".github/workflows/ediffiqa-directml-probe.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ediffiqa-directml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements/runtime-directml.txt
            requirements/build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime-directml.txt -r requirements/build.txt
          python -m pip install "onnx>=1.16,<2"

      - name: Compile research tools
        shell: pwsh
        run: |
          python -m py_compile tools/benchmarks/ediffiqa_graph_lab.py
          python -m py_compile tools/benchmarks/ediffiqa_candidate_probe.py
          python tools/benchmarks/ediffiqa_candidate_probe.py --help

      - name: Analyze legacy vs upstream eDifFIQA graphs
        shell: pwsh
        run: |
          $lab = Join-Path $PWD "_research_output\ediffiqa-graph-lab"
          New-Item -ItemType Directory -Force $lab | Out-Null

          $upstream = Join-Path $lab "ediffiqa_t_upstream.onnx"
          Invoke-WebRequest -Uri "https://github.com/yakhyo/face-image-quality-assessment/releases/download/weights/ediffiqa_t.onnx" -OutFile $upstream

          $hash = (Get-FileHash $upstream -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "7a83be63e6583ec5800fa0762e219b65b4b9f1721c4d210bfe2f16c0478832bb") {
            throw "Unexpected upstream SHA256: $hash"
          }

          python tools/benchmarks/ediffiqa_graph_lab.py --legacy resources/models/ediffiqa_t.onnx --upstream $upstream --out-dir $lab

          $report = Get-Content (Join-Path $lab "ediffiqa-graph-lab.json") -Raw | ConvertFrom-Json

          if (-not $report.candidates.legacy_fixed.cpu_equivalence.allclose) {
            throw "Fixed legacy model is not CPU-equivalent."
          }
          if (-not $report.candidates.legacy_fixed_optimized.cpu_equivalence.allclose) {
            throw "Optimized fixed legacy model is not CPU-equivalent."
          }
          if (-not $report.candidates.upstream_current.cpu_equivalence.allclose) {
            throw "Current upstream model is not CPU-equivalent."
          }

          Write-Host "Legacy input:" ($report.legacy.inputs | ConvertTo-Json -Compress)
          Write-Host "Fixed input:" ($report.candidates.legacy_fixed.summary.inputs | ConvertTo-Json -Compress)
          Write-Host "Optimized input:" ($report.candidates.legacy_fixed_optimized.summary.inputs | ConvertTo-Json -Compress)
          Write-Host "Upstream input:" ($report.candidates.upstream_current.summary.inputs | ConvertTo-Json -Compress)

          Write-Host "Legacy shape nodes:" ($report.legacy.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Fixed shape nodes:" ($report.candidates.legacy_fixed.summary.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Optimized shape nodes:" ($report.candidates.legacy_fixed_optimized.summary.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)
          Write-Host "Upstream shape nodes:" ($report.candidates.upstream_current.summary.shape_related_nodes | ConvertTo-Json -Depth 8 -Compress)

          Write-Host "Legacy reshape paths:" ($report.legacy_reshape_paths | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Fixed reshape paths:" ($report.candidates.legacy_fixed.reshape_paths | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Optimized reshape paths:" ($report.candidates.legacy_fixed_optimized.reshape_paths | ConvertTo-Json -Depth 10 -Compress)
          Write-Host "Upstream reshape paths:" ($report.candidates.upstream_current.reshape_paths | ConvertTo-Json -Depth 10 -Compress)

          Write-Host "Upstream max abs diff:" $report.candidates.upstream_current.cpu_equivalence.max_abs_diff

      - name: Build candidate probe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/ediffiqa_candidate_probe.spec

      - name: Validate candidate probe as checkpoint drop-in
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $outerZip = Join-Path $PWD "_research_output\checkpoint-artifact.zip"
          $outerDir = Join-Path $PWD "_research_output\checkpoint-artifact"
          $baseDir = Join-Path $PWD "_research_output\checkpoint-base"

          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/JInghoeg/face-lora-dataset-selector/actions/artifacts/12889766078/zip" -OutFile $outerZip
          Expand-Archive -Path $outerZip -DestinationPath $outerDir -Force

          $inner = Get-ChildItem $outerDir -Recurse -File |
            Where-Object { $_.Name -eq "FaceLoRA-DirectML-Checkpoint-Windows-x64.zip" } |
            Select-Object -First 1
          if (-not $inner) { throw "Checkpoint inner ZIP not found." }

          Expand-Archive -Path $inner.FullName -DestinationPath $baseDir -Force
          $checkpointExe = Get-ChildItem $baseDir -Recurse -File |
            Where-Object { $_.Name -eq "Face LoRA DirectML Checkpoint.exe" } |
            Select-Object -First 1
          if (-not $checkpointExe) { throw "Checkpoint EXE not found." }

          $targetDir = $checkpointExe.Directory.FullName
          $probeExe = Join-Path $PWD "dist\FaceLoRA-eDifFIQA-Candidate-Probe\Face LoRA eDifFIQA Candidate Probe.exe"
          $targetExe = Join-Path $targetDir "Face LoRA eDifFIQA Candidate Probe.exe"
          Copy-Item $probeExe $targetExe -Force

          $candidates = Join-Path $targetDir "ediffiqa-candidates"
          New-Item -ItemType Directory -Force $candidates | Out-Null
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa_t_legacy_batch1_fixed.onnx" $candidates -Force
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa_t_legacy_batch1_optimized.onnx" $candidates -Force
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa_t_upstream.onnx" $candidates -Force

          foreach ($candidate in @("legacy_fixed","legacy_fixed_optimized","upstream_current")) {
            $out = Join-Path $PWD "_research_output\dropin-$candidate-cpu.json"
            $progress = Join-Path $PWD "_research_output\dropin-$candidate-cpu.progress.jsonl"
            $args = @("--child","--candidate",$candidate,"--provider","cpu","--output",$out,"--progress",$progress)
            $p = Start-Process -FilePath $targetExe -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Drop-in CPU probe failed for $candidate: $($p.ExitCode)" }
            $result = Get-Content $out -Raw | ConvertFrom-Json
            if ($result.status -ne "pass") { throw "Drop-in candidate did not pass CPU: $candidate" }
          }

      - name: Build candidate artifact
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "_research_output\ediffiqa-candidate-package"
          $models = Join-Path $dir "ediffiqa-candidates"
          New-Item -ItemType Directory -Force $models | Out-Null

          Copy-Item (Join-Path $PWD "dist\FaceLoRA-eDifFIQA-Candidate-Probe\Face LoRA eDifFIQA Candidate Probe.exe") $dir
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa_t_legacy_batch1_fixed.onnx" $models -Force
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa_t_legacy_batch1_optimized.onnx" $models -Force
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa_t_upstream.onnx" $models -Force
          Copy-Item "_research_output\ediffiqa-graph-lab\ediffiqa-graph-lab.json" $dir -Force

          @'
          eDifFIQA DirectML Candidate Probe
          =================================

          Extract this package into the existing DirectML checkpoint folder.
          It adds:
          - Face LoRA eDifFIQA Candidate Probe.exe
          - ediffiqa-candidates\ (3 candidate ONNX files)
          - ediffiqa-graph-lab.json

          The target probe runs ONLY these eDifFIQA candidates.
          DirectML Python fallback and CPU EP fallback are disabled.
          A PASS therefore requires a real DmlExecutionProvider session.

          Send:
          ediffiqa-candidate-results\<timestamp>\ediffiqa-directml-candidates.json
          back to ChatGPT.
          '@ | Set-Content -Path (Join-Path $dir "README.txt") -Encoding UTF8

          Compress-Archive -Path "$dir\*" -DestinationPath "FaceLoRA-eDifFIQA-Candidate-Probe.zip" -CompressionLevel Optimal -Force

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceLoRA-eDifFIQA-Candidate-Probe
          path: FaceLoRA-eDifFIQA-Candidate-Probe.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload graph lab evidence
        uses: actions/upload-artifact@v4
        with:
          name: eDifFIQA-Graph-Lab
          path: |
            _research_output/ediffiqa-graph-lab/ediffiqa-graph-lab.json
            _research_output/ediffiqa-graph-lab/ediffiqa_t_legacy_batch1_fixed.onnx
            _research_output/ediffiqa-graph-lab/ediffiqa_t_legacy_batch1_optimized.onnx
            _research_output/ediffiqa-graph-lab/ediffiqa_t_upstream.onnx
          if-no-files-found: error
          retention-days: 7
