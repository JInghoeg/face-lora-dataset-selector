name: Text Cleanup Boundary

on:
  push:
    branches:
      - refactor/v0.3-text-cleanup-boundary
    paths:
      - "app.py"
      - "text_detector.py"
      - "core/**"
      - "features/text_cleanup/**"
      - "ui/**"
      - "tests/text_cleanup_ui_smoke.py"
      - "application/**"
      - "infrastructure/**"
      - ".importlinter"
      - ".github/workflows/text-cleanup-boundary.yml"
  pull_request:
    paths:
      - "app.py"
      - "text_detector.py"
      - "core/**"
      - "features/text_cleanup/**"
      - "ui/**"
      - "tests/text_cleanup_ui_smoke.py"
      - "application/**"
      - "infrastructure/**"
      - ".importlinter"
      - ".github/workflows/text-cleanup-boundary.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  text-cleanup:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install production runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Compile backend and UI adapters
        shell: pwsh
        run: |
          python -m compileall features/text_cleanup application ui app.py text_detector.py

      - name: Text Cleanup backend self-test
        shell: pwsh
        run: |
          python -c "from features.text_cleanup.service import self_test; self_test()"

      - name: Full selector self-test
        shell: pwsh
        run: |
          python app.py --self-test

      - name: Text Cleanup Qt presentation smoke
        shell: pwsh
        run: |
          python tests/text_cleanup_ui_smoke.py

      - name: Optional Text Cleanup absence startup smoke
        if: ${{ matrix.python == '3.12' }}
        shell: pwsh
        run: |
          $feature = "features\text_cleanup"
          $featureOff = "features\text_cleanup.__disabled_for_smoke__"
          try {
            Move-Item $feature $featureOff
            @'
          from PySide6.QtWidgets import QApplication
          import app

          assert not app.BACKEND.feature_available("text_cleanup")
          qapp = QApplication.instance() or QApplication([])
          window = app.Window()
          assert window.sub is None
          window.close()
          print("optional Text Cleanup absence startup OK")
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw "App startup failed without optional Text Cleanup feature" }
          }
          finally {
            if (Test-Path $featureOff) { Move-Item $featureOff $feature }
          }

  portable-smoke:
    needs: text-cleanup
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[portable]')) }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt -r requirements-build.txt

      - name: Build Portable
        shell: pwsh
        run: |
          .\build_portable.ps1

      - name: Portable self-test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\Face-LoRA-Dataset-Selector\Face LoRA Dataset Selector.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable not found: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $err = Join-Path (Split-Path $exe) "startup-error.txt"
            if (Test-Path $err) { Get-Content $err }
            throw "Portable self-test failed with exit code $($p.ExitCode)"
          }

      - name: Upload Text Cleanup Portable QA
        uses: actions/upload-artifact@v4
        with:
          name: text-cleanup-portable-qa
          path: dist/Face-LoRA-Dataset-Selector
          retention-days: 7
