name: Build Windows Portable

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve approved release gate
        id: release_gate
        shell: pwsh
        run: |
          "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ("${{ github.event_name }}" -ne "push" -or "${{ github.ref }}" -ne "refs/heads/main") {
            exit 0
          }

          $gatePath = ".project/release_gate.json"
          if (-not (Test-Path $gatePath)) {
            throw "Missing release gate: $gatePath"
          }

          $before = "${{ github.event.before }}"
          if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Fluent UI runtime (Essentials-only)
        shell: pwsh
        run: |
          python tools/install_ui_dependencies.py
          python -c "import importlib.util, qfluentwidgets; assert importlib.util.find_spec('PySide6.QtCharts') is None, 'PySide6-Addons unexpectedly installed'; print('Fluent UI Essentials-only runtime OK')"

      - name: Source runtime self-test
        shell: pwsh
        run: |
          python app.py --self-test

      - name: Build portable folder
        shell: pwsh
        run: |
          .\tools/build_portable.ps1

      - name: Portable size report
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist\Face-LoRA-Dataset-Selector"
          $files = Get-ChildItem $root -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          $totalMB = [math]::Round($total / 1MB, 1)
          "Uncompressed portable: $totalMB MB" | Tee-Object -FilePath "portable-size-report.txt"
          $top = $files | Sort-Object Length -Descending | Select-Object -First 40
          foreach ($file in $top) {
            $relative = $file.FullName.Substring($root.Length + 1)
            $line = ("{0,7:N1} MB  {1}" -f ($file.Length / 1MB), $relative)
            $line | Tee-Object -FilePath "portable-size-report.txt" -Append | Write-Host
          }

      - name: Portable smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\Face-LoRA-Dataset-Selector\Face LoRA Dataset Selector.exe"
          if (-not (Test-Path $exe)) {
            throw "Portable executable not found: $exe"
          }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $err = Join-Path (Split-Path $exe) "startup-error.txt"
            if (Test-Path $err) {
              Write-Host "---- startup-error.txt ----"
              Get-Content $err
            }
            throw "Portable self-test failed with exit code $($p.ExitCode)"
          }

      - name: Build incremental QA overlay
        shell: pwsh
        run: |
          .\tools\build-qa-overlay.ps1 `
            -PortableRoot ".\dist\Face-LoRA-Dataset-Selector" `
            -OverlayRoot ".\qa-overlay"

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $name = "Face-LoRA-Dataset-Selector-Windows-x64-Portable"
          $zip = Join-Path $PWD ($name + ".zip")
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\Face-LoRA-Dataset-Selector" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content ($zip + ".sha256") -Encoding ascii

      - name: QA Prepare full-to-overlay roundtrip smoke
        shell: pwsh
        run: |
          .\tests\qa_portable_helper_smoke.ps1 `
            -RepoRoot "." `
            -PortableRoot ".\dist\Face-LoRA-Dataset-Selector" `
            -OverlayRoot ".\qa-overlay" `
            -FullZip ".\Face-LoRA-Dataset-Selector-Windows-x64-Portable.zip" `
            -FullChecksum ".\Face-LoRA-Dataset-Selector-Windows-x64-Portable.zip.sha256"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Face-LoRA-Dataset-Selector-Windows-x64-Portable
          path: |
            Face-LoRA-Dataset-Selector-Windows-x64-Portable.zip
            Face-LoRA-Dataset-Selector-Windows-x64-Portable.zip.sha256
            portable-size-report.txt
          if-no-files-found: error

      - name: Upload incremental QA overlay
        uses: actions/upload-artifact@v4
        with:
          name: Face-LoRA-Dataset-Selector-Windows-x64-QA-Overlay
          path: qa-overlay/
          if-no-files-found: error

      - name: Attach approved portable build to GitHub Release
        if: "${{ steps.release_gate.outputs.should_release == 'true' }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Face-LoRA-Dataset-Selector-Windows-x64-Portable.zip"
          $sum = "$zip.sha256"
          $tag = "${{ steps.release_gate.outputs.tag }}"
          $notes = "${{ steps.release_gate.outputs.notes }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; refusing to overwrite published assets."
            exit 0
          }

          gh release create $tag $zip $sum --target "${{ github.sha }}" --title "Face LoRA Dataset Selector $tag" --notes-file $notes
