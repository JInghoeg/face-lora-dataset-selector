name: Auto Crop UI Spike

on:
  pull_request:
    paths:
      - "tests/auto_crop_ui_spike.py"
      - "openspec/changes/auto-crop-review-ui-spike/**"
      - ".github/workflows/auto-crop-ui-spike.yml"
  push:
    branches:
      - ux/auto-crop-review-spike
    paths:
      - "tests/auto_crop_ui_spike.py"
      - "openspec/changes/auto-crop-review-ui-spike/**"
      - ".github/workflows/auto-crop-ui-spike.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  render-and-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install production runtime plus spike candidate
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir qt-material==2.17
          python -m pip install --no-cache-dir "PySide6>=6.6,<6.9" PySide6-Fluent-Widgets==1.11.3
          python -c "import PySide6, qfluentwidgets; print('PySide6', PySide6.__version__); print('QFluentWidgets import OK')"
          python -m pip show PySide6 PySide6-Essentials PySide6-Addons PySide6-Fluent-Widgets

      - name: Render real Auto Crop dialog and verify ROI
        shell: pwsh
        run: |
          python tests/auto_crop_ui_spike.py --out "ui-spike-${{ matrix.python }}"

      - name: Upload rendered candidates
        if: ${{ matrix.python == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-crop-ui-spike-screenshots
          path: ui-spike-3.12/*.png
          if-no-files-found: error
          retention-days: 7
