name: Windows ML Research

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/benchmarks/windows_ml_runtime_probe.py"
      - "tools/benchmarks/requirements-windowsml.txt"
      - "tools/benchmarks/run-windows-ml-checkpoint.ps1"
      - "docs/research/windows-ml-runtime-evaluation.md"
      - ".github/workflows/windows-ml-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ml-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe-sanity:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/benchmarks/requirements-windowsml.txt

      - name: Install research-only Windows ML dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/benchmarks/requirements-windowsml.txt

      - name: Verify pinned research distributions
        shell: pwsh
        run: |
          @'
          from importlib import metadata

          expected = {
              "wasdk-Microsoft.Windows.AI.MachineLearning": "2.3.0",
              "wasdk-Microsoft.Windows.ApplicationModel.DynamicDependency.Bootstrap": "2.3.0",
              "onnxruntime-windowsml": "1.25.2.202605110140",
          }
          for name, wanted in expected.items():
              actual = metadata.version(name)
              print(f"{name}={actual}")
              if actual != wanted:
                  raise SystemExit(f"{name}: expected {wanted}, got {actual}")
          '@ | python -

      - name: Verify Windows ML ORT dynamic EP API shape
        shell: pwsh
        run: |
          @'
          import onnxruntime as ort

          required_module = [
              "get_ep_devices",
              "register_execution_provider_library",
          ]
          for name in required_module:
              value = getattr(ort, name, None)
              print(f"onnxruntime.{name}: {value}")
              if not callable(value):
                  raise SystemExit(f"Missing required dynamic EP API: onnxruntime.{name}")

          options = ort.SessionOptions()
          for name in ("add_provider_for_devices", "has_providers"):
              value = getattr(options, name, None)
              print(f"SessionOptions.{name}: {value}")
              if not callable(value):
                  raise SystemExit(f"Missing required dynamic EP API: SessionOptions.{name}")
          '@ | python -

      - name: Compile probe and validate CLI
        shell: pwsh
        run: |
          python -m py_compile tools/benchmarks/windows_ml_runtime_probe.py
          python tools/benchmarks/windows_ml_runtime_probe.py --help

      - name: Validate workstation helper syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/benchmarks/run-windows-ml-checkpoint.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell workstation helper has syntax errors."
          }

      - name: Safe discovery probe
        shell: pwsh
        run: |
          $report = Join-Path $PWD "windows-ml-ci-probe.json"
          python tools/benchmarks/windows_ml_runtime_probe.py --output $report
          $exitCode = $LASTEXITCODE

          if (-not (Test-Path $report)) {
            throw "Windows ML probe did not write its JSON report."
          }

          $json = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host "Probe exit=$exitCode status=$($json.status)"
          Write-Host "Windows build=$($json.environment.windows_build)"
          Write-Host "Target=$($json.target_provider)"

          # Hosted CI is not expected to expose an NVIDIA EP and may not have
          # the matching Windows App SDK Runtime installed. These are valid
          # feasibility observations, not product failures. The probe must,
          # however, fail safely without downloading anything.
          $allowed = @(
            "unsupported_windows_build",
            "dependency_import_failed",
            "app_sdk_runtime_unavailable",
            "target_provider_unavailable",
            "download_required",
            "pass"
          )
          if ($allowed -notcontains [string]$json.status) {
            throw "Unexpected Windows ML probe status: $($json.status)"
          }
          if ($json.requested.ensure) {
            throw "CI discovery probe must never enable EP download."
          }

          # The probe uses non-zero exit codes for expected feasibility states
          # such as a missing Windows App SDK Runtime. Reaching this point means
          # the JSON status was explicitly accepted above.
          exit 0

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: windows-ml-ci-probe
          path: windows-ml-ci-probe.json
          if-no-files-found: error
