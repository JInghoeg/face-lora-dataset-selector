name: Settings Visual Render

on:
  push:
    branches:
      - feat/v04-stable-incremental-updater
    paths:
      - "src/ui/qt/settings_page.py"
      - "tests/settings_visual_render.py"
      - ".github/workflows/settings-visual-render.yml"
  pull_request:
    paths:
      - "src/ui/qt/settings_page.py"
      - "tests/settings_visual_render.py"
      - ".github/workflows/settings-visual-render.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt render runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "PySide6-Essentials>=6.6,<6.9"

      - name: Download CJK font for deterministic render
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP "NotoSansCJKsc-Regular.otf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" -OutFile $font
          "SETTINGS_VISUAL_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render actual SettingsPage
        shell: pwsh
        run: |
          python tests/settings_visual_render.py --out settings-render

      - name: Upload Settings renders
        uses: actions/upload-artifact@v4
        with:
          name: settings-v04-real-qt-renders
          path: settings-render/*.png
          if-no-files-found: error
          retention-days: 14
