name: Project Memory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate project continuity
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          STATE_PATH: docs/PROJECT_STATE.md
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          body = os.environ.get("PR_BODY") or ""
          state_path = os.environ["STATE_PATH"]

          yes = bool(re.search(r"^- \[[xX]\]\s+Yes\b", body, re.M))
          no = bool(re.search(r"^- \[[xX]\]\s+No\b", body, re.M))
          if yes == no:
              raise SystemExit("Select exactly one Project continuity State impact choice: Yes or No.")

          qa_patterns = {
              "pass": r"^- \[[xX]\]\s+HUMAN PASS\b",
              "deferred": r"^- \[[xX]\]\s+HUMAN UNVERIFIED\b",
              "not_required": r"^- \[[xX]\]\s+HUMAN NOT REQUIRED\b",
              "immediate": r"^- \[[xX]\]\s+IMMEDIATE HUMAN QA REQUIRED\b",
          }
          qa = {k: bool(re.search(v, body, re.M)) for k, v in qa_patterns.items()}
          if sum(qa.values()) != 1:
              raise SystemExit("Select exactly one Human QA state.")

          def field(label: str) -> str:
              m = re.search(rf"^{re.escape(label)}:\s*(.*)$", body, re.M | re.I)
              return (m.group(1).strip() if m else "")

          if qa["immediate"]:
              raise SystemExit("IMMEDIATE HUMAN QA REQUIRED is selected; merge remains blocked until this becomes HUMAN PASS.")

          if qa["deferred"]:
              debt = field("QA debt issue")
              if not re.fullmatch(r"#\d+", debt):
                  raise SystemExit("HUMAN UNVERIFIED requires 'QA debt issue: #N'.")

          state = Path(state_path)
          if not state.exists():
              raise SystemExit(f"Missing canonical state file: {state_path}")

          required = [
              "## Repository state",
              "## Verified complete",
              "## In progress",
              "## Current objective",
              "## Blockers / uncertainties",
              "## Human QA debt",
              "## Next action",
              "## Do not repeat",
              "## Authoritative trackers",
          ]
          content = state.read_text(encoding="utf-8")
          missing = [h for h in required if h not in content]
          if missing:
              raise SystemExit("PROJECT_STATE missing sections: " + ", ".join(missing))

          base = os.environ.get("BASE_REF") or ""
          subprocess.run(["git", "fetch", "origin", base, "--quiet"], check=True)
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"origin/{base}...HEAD"], text=True
          ).splitlines()

          state_changed = state_path in changed
          if yes and not state_changed:
              raise SystemExit(f"State impact is Yes but {state_path} is unchanged.")
          if no and state_changed:
              raise SystemExit(f"State impact is No but {state_path} changed.")

          high_signal = (
              "features/", "application/", "core/", "infrastructure/",
              "ui/", "packaging/", "tools/", "src/", "app.py", "requirements",
              "pyproject.toml", ".github/workflows/"
          )
          suspicious = [
              p for p in changed
              if p != state_path and any(p == x or p.startswith(x) for x in high_signal)
          ]

          if no and suspicious:
              rationale = field("State impact rationale")
              if not rationale or rationale.lower() in {"n/a", "none", "-", "no"}:
                  raise SystemExit(
                      "High-signal paths changed while State impact is No. "
                      "Provide a concrete 'State impact rationale: ...'."
                  )

          product_paths = (
              "features/", "application/", "core/", "infrastructure/",
              "ui/", "app.py", "requirements"
          )
          product_changed = [
              p for p in changed
              if any(p == x or p.startswith(x) for x in product_paths)
          ]
          if qa["not_required"] and product_changed:
              raise SystemExit(
                  "HUMAN NOT REQUIRED cannot be used when product/runtime paths changed: "
                  + ", ".join(product_changed)
              )

          print("Project Memory Gate: PASS")
          PY
