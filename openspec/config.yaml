schema: spec-driven

context: |
  Project: Face LoRA Dataset Selector v0.3 (brownfield PySide6 desktop app).
  Product branch: feature/v0.3-workflow-recovery.
  Architecture invariant: Qt presentation -> SelectorApplication -> independent feature backends.
  Feature backends remain Qt-free; optional features must not create destructive sibling coupling.
  Reuse mature components before custom primitives. Do not rewrite validated algorithms for architecture aesthetics.
  Risk-based QA: low-risk, reversible, automated-test-covered work may remain HUMAN UNVERIFIED until a coherent checkpoint.

  Accepted v0.3 execution order:
  1. Auto Crop manual ROI.
  2. A very limited architecture wrap-up: Duplicate feature boundary + Text Cleanup frontend/backend separation through SelectorApplication, without algorithm rewrites.
  3. Real UX/UI modernization: build/expand ui/qt, progressively move presentation out of app.py, research Qt Model/View and reusable UI components, keep backend stable.
  4. Only after that, rebuild the unified Portable and run consolidated QA.

  Current phase: step 3, UX/UI modernization.
  Existing HUMAN UNVERIFIED items remain tracked in GitHub Issue #17 and do not by themselves redefine the current phase.

rules:
  proposal:
    - State the current accepted phase and distinguish it from the local change scope.
    - Do not reorder the accepted four-stage sequence from stale summaries or inferred release status.
    - Reuse existing GitHub issues/PR evidence instead of rewriting history.
  design:
    - Keep SelectorApplication and feature backend contracts stable unless a concrete implementation blocker is documented.
    - Prefer incremental presentation extraction over a whole-application rewrite.
    - Keep UI-specific dependencies out of backend packages.
  tasks:
    - Every task must name an objective verification step.
    - Keep tasks small enough to stop safely between commits.
    - Do not require immediate human QA for bounded reversible presentation refactors when automated coverage is meaningful.
